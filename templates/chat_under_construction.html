{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chat · CUnnect</title>
  <style>
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; background:#000; overflow:hidden; }
    .video-page { position:relative; width:100%; height:100dvh; overflow:hidden; background:#000; }

    /* Full-screen blurred copy fills portrait space without cropping the real video. */
    .video-background {
      position:absolute;
      inset:-28px;
      width:calc(100% + 56px);
      height:calc(100% + 56px);
      display:block;
      object-fit:cover;
      filter:blur(24px) brightness(.45);
      transform:scale(1.08);
    }

    /* Main 16:9 video stays fully visible and never crops. */
    .video-main {
      position:absolute;
      z-index:1;
      top:50%;
      left:0;
      width:100%;
      height:auto;
      max-height:100%;
      display:block;
      transform:translateY(-50%);
      background:transparent;
    }

    .shade { position:absolute; z-index:2; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(0,0,0,.20),transparent 30%,rgba(0,0,0,.22)); }
    .back { position:absolute; z-index:3; top:max(16px, env(safe-area-inset-top)); left:16px; width:42px; height:42px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.25); border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font:28px/1 Arial,sans-serif; text-decoration:none; backdrop-filter:blur(7px); }
    .sound { position:absolute; z-index:3; right:16px; bottom:max(18px, env(safe-area-inset-bottom)); width:42px; height:42px; border:1px solid rgba(241,11,29,.55); border-radius:50%; background:rgba(0,0,0,.62); color:#fff; cursor:pointer; font-size:17px; backdrop-filter:blur(7px); }
    .error { position:absolute; z-index:4; inset:0; display:none; align-items:center; justify-content:center; padding:28px; color:#fff; font:14px Arial,sans-serif; text-align:center; background:#000; }
    .error.show { display:flex; }
    .error strong { display:block; margin-bottom:8px; color:#ff9da5; }
  </style>
</head>
<body>
  <main class="video-page">
    <video class="video-background" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="{% static 'images/chat_under_construction.mp4' %}" type="video/mp4">
    </video>

    <video id="chat-construction-video" class="video-main" autoplay muted loop playsinline preload="auto">
      <source src="{% static 'images/chat_under_construction.mp4' %}" type="video/mp4">
    </video>

    <div class="shade"></div>
    <a class="back" href="{% url 'dashboard' %}" aria-label="Back to dashboard">‹</a>
    <button id="sound-button" class="sound" type="button" aria-label="Turn sound on">🔇</button>

    <div id="video-error" class="error">
      <div>
        <strong>Video could not play.</strong>
        Use an H.264 MP4 at:<br>
        <code>static/videos/chat_under_construction.mp4</code>
      </div>
    </div>
  </main>

  <script>
    const mainVideo = document.getElementById("chat-construction-video");
    const soundButton = document.getElementById("sound-button");
    const errorBox = document.getElementById("video-error");

    function startVideo() {
      mainVideo.muted = true;
      mainVideo.play().catch(() => {});
    }

    mainVideo.addEventListener("canplay", startVideo);
    mainVideo.addEventListener("error", () => errorBox.classList.add("show"));
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) startVideo();
    });

    soundButton.addEventListener("click", () => {
      mainVideo.muted = !mainVideo.muted;
      soundButton.textContent = mainVideo.muted ? "🔇" : "🔊";
      mainVideo.play().catch(() => {});
    });

    startVideo();
  </script>
</body>
</html>
