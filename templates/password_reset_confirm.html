<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password - CUIMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-black">
    <div class="w-full max-w-md px-4">
        <div class="bg-zinc-900 border border-white/10 rounded-3xl p-8">
            <h2 class="text-white text-3xl font-bold text-center mb-6">Set New Password</h2>

            <form method="POST">
                {% csrf_token %}
                <div class="space-y-4">
                    <div>
                        <label class="text-white text-sm">New Password</label>
                        <input type="password" name="new_password1" required 
                               class="w-full bg-zinc-800 border border-white/10 text-white rounded-2xl py-3.5 px-5 mt-1">
                    </div>
                    <div>
                        <label class="text-white text-sm">Confirm New Password</label>
                        <input type="password" name="new_password2" required 
                               class="w-full bg-zinc-800 border border-white/10 text-white rounded-2xl py-3.5 px-5 mt-1">
                    </div>
                </div>
                <button type="submit"
                        class="mt-6 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-6 rounded-2xl">
                    Reset Password
                </button>
            </form>
        </div>
    </div>
</body>
</html>
