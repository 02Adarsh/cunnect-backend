<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - CUIMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-black">
    <div class="w-full max-w-md px-4">
        <div class="bg-zinc-900 border border-white/10 rounded-3xl p-8">
            <h2 class="text-white text-3xl font-bold text-center mb-6">Forgot Password?</h2>
            <p class="text-zinc-400 text-center mb-6">Enter your university email to reset your password</p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <input type="email" name="email" required 
                           class="w-full bg-zinc-800 border border-white/10 text-white placeholder:text-zinc-400 text-sm rounded-2xl py-3.5 px-5 focus:outline-none focus:border-red-500/50"
                           placeholder="Enter your @culkomail.in email">
                </div>
                <button type="submit"
                        class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 px-6 rounded-2xl">
                    Send Reset Link
                </button>
            </form>
        </div>
    </div>
</body>
</html>
