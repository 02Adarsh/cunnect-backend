{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CUnnect - Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap");

      :root {
        --red: #ef1022;
        --card: rgba(19, 19, 19, 0.91);
        --line: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        color: #fff;
        font-family: "Inter", system-ui, sans-serif;
        background: #000;
      }

      /* ── Background Layer ── */
      .background {
        position: fixed;
        z-index: 0;
        inset: 0;
        overflow: hidden;
        background: #050505;
      }

      .background video,
      .background-image {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
      }

      .background-image {
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .background::before {
        position: absolute;
        z-index: 1;
        inset: 0;
        background: rgba(0, 0, 0, 0.47);
        content: "";
      }

      .background::after {
        position: absolute;
        z-index: 2;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.18),
          rgba(0, 0, 0, 0.28) 45%,
          rgba(0, 0, 0, 0.76)
        );
        content: "";
      }

      /* ── Page Centre ── */
      .page {
        position: relative;
        z-index: 5;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
      }

      /* ── Card ── */
      .login-card {
        width: min(100%, 390px);
        padding: 30px 25px 25px;
        border: 1px solid var(--line);
        border-radius: 25px;
        background: var(--card);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(18px);
      }

      /* ── Premium CUnnect wordmark ── */
      .login-logo-wrap {
        margin: 0 auto 29px;
        text-align: center;
      }

      .cunnect-logo {
        display: inline-flex;
        align-items: baseline;
        font-family: "Poppins", system-ui, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -3px;
        line-height: 1;
      }

      .logo-cu {
        color: #ff1022;
        text-shadow: 0 0 20px rgba(255, 16, 34, 0.45),
                     0 0 60px rgba(255, 16, 34, 0.18);
      }

      .logo-nnect {
        color: #fff;
        text-shadow: 0 2px 10px rgba(255, 255, 255, 0.16);
      }

      .logo-tagline {
        width: 100%;
        display: block;
        margin: 12px auto 0;
        margin-left: 10px;
        color: #D4C7A3;
        text-align: center;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 2px;
      }

      .login-title {
        margin: 0;
        color: #fff;
        text-align: center;
        font-family: "Poppins", system-ui, sans-serif;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .login-subtitle {
        margin: 7px 0 23px;
        color: #a4a4a4;
        text-align: center;
        font-size: 12px;
      }

      /* ── Error Messages ── */
      .message {
        margin: 0 0 16px;
        padding: 10px 12px;
        border: 1px solid rgba(239, 16, 34, 0.5);
        border-radius: 10px;
        background: rgba(239, 16, 34, 0.12);
        color: #ffb0b7;
        font-size: 12px;
        line-height: 1.35;
      }

      /* ── Input Field ── */
      .field-wrap {
        position: relative;
        margin-bottom: 16px;
      }

      .field {
        width: 100%;
        height: 50px;
        padding: 0 48px 0 15px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        outline: none;
        background: rgba(38, 38, 38, 0.8);
        color: #fff;
        font: inherit;
        font-size: 13px;
        transition: 0.2s ease;
      }

      .field::placeholder {
        color: #999;
      }

      .field:focus {
        border-color: rgba(239, 16, 34, 0.75);
        box-shadow: 0 0 0 3px rgba(239, 16, 34, 0.12);
      }

      .field-icon {
        position: absolute;
        top: 50%;
        right: 17px;
        color: #aaa;
        font-size: 17px;
        pointer-events: none;
        transform: translateY(-50%);
      }

      /* ── Next Button ── */
      .next-btn {
        width: 100%;
        height: 50px;
        border: 0;
        border-radius: 14px;
        background: var(--red);
        box-shadow: 0 9px 20px rgba(239, 16, 34, 0.25);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 1px;
        transition: 0.2s ease;
      }

      .next-btn:hover {
        background: #d90a1b;
        transform: translateY(-1px);
      }

      /* ── Divider ── */
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 18px 0;
        color: #9a9a9a;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .divider::before,
      .divider::after {
        height: 1px;
        flex: 1;
        background: rgba(255, 255, 255, 0.12);
        content: "";
      }

      /* ── Gold Animated Registration Button ── */
      .gold-border {
        position: relative;
        z-index: 1;
        display: block;
        overflow: hidden;
        width: 100%;
        padding: 14px 12px;
        border-radius: 14px;
        background: #1987cf;
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.2px;
        text-align: center;
        text-decoration: none;
      }

      .gold-border::before {
        position: absolute;
        z-index: -1;
        inset: -2px;
        border-radius: 14px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 215, 0, 0.95),
          rgba(255, 255, 255, 0.9),
          rgba(255, 215, 0, 0.95),
          transparent
        );
        background-size: 300% 300%;
        content: "";
        filter: blur(2px);
        animation: goldMove 2.5s linear infinite;
      }

      .gold-border::after {
        position: absolute;
        z-index: -1;
        inset: 2px;
        border-radius: 12px;
        background: #1987cf;
        content: "";
      }

      @keyframes goldMove {
        from {
          background-position: 0% 50%;
        }
        to {
          background-position: 300% 50%;
        }
      }

      /* ── Footer Note ── */
      .secure-note {
        margin: 21px 0 0;
        color: #777;
        text-align: center;
        font-size: 10px;
      }

      /* ── Responsive ── */
      @media (max-width: 380px) {
        .login-card {
          padding: 27px 20px 22px;
        }

        .cunnect-logo {
          font-size: 38px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Background Layer -->
    <div class="background">
      <video id="loginBackgroundVideo" autoplay muted loop playsinline>
        <source src="{% static 'images/CU.mp4' %}" type="video/mp4" />
      </video>
    </div>

    <!-- Main Content -->
    <main class="page">
      <section class="login-card">
        <!-- Logo -->
        <div class="login-logo-wrap">
          <div class="cunnect-logo">
            <span class="logo-cu">CU</span><span class="logo-nnect">nnect</span>
          </div>
          <p class="logo-tagline">YOUR CAMPUS. CONNECTED.</p>
        </div>

        <h1 class="login-title">LOGIN</h1>
        <p class="login-subtitle">Enter your User ID to continue</p>

        <!-- Django Messages -->
        {% if messages %}
          {% for message in messages %}
          <div class="message">{{ message }}</div>
          {% endfor %}
        {% endif %}

        <!-- Login Form -->
        <form method="post" action="{% url 'scraper_app:login' %}">
          {% csrf_token %}

          <div class="field-wrap">
            <input
              class="field"
              type="text"
              name="uid"
              value="{{ uid|default:'' }}"
              placeholder="Enter User ID"
              autocomplete="username"
              required
            />
            <i class="fa-solid fa-user field-icon"></i>
          </div>

          <button class="next-btn" type="submit">NEXT</button>

          <div class="divider">OR</div>

          

          <p class="secure-note">Secure campus login portal</p>
        </form>
      </section>
    </main>

    <!-- Background Video Rotation -->
    <script>
      const videos = [
        "{% static 'images/CU.mp4' %}",
      ];

      const loginVideo = document.getElementById("loginBackgroundVideo");
      if (loginVideo && videos.length > 1) {
        const videoSource = loginVideo.querySelector("source");
        let currentVideo = 0;

        window.setInterval(() => {
          currentVideo = (currentVideo + 1) % videos.length;
          videoSource.src = videos[currentVideo];
          loginVideo.load();
          loginVideo.play().catch(() => {});
        }, 5000);
      }
    </script>
  </body>
</html>
