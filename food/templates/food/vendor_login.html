{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Login · CUnnect</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap");

    :root {
      --panel: rgba(18, 18, 18, .93);
      --line: #2b2b2b;
      --red: #f10b1d;
      --muted: #9e9e9e;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: #050505;
      color: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Background video */
    .background-video {
      position: fixed;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050505;
    }

    /* Dark overlay so login form remains readable */
    .video-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(135deg, rgba(0, 0, 0, .79), rgba(0, 0, 0, .64)),
        radial-gradient(circle at 85% 7%, rgba(241, 11, 29, .28), transparent 32%);
    }

    /* This wrapper keeps the form exactly in screen centre */
    .page-center {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      width: min(100%, 390px);
      padding: 34px 25px 25px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .60);
      backdrop-filter: blur(10px);
    }

    /* Premium CUnnect wordmark — same style as your main Login page. */
    .login-logo-wrap {
      margin: 0 auto 30px;
      text-align: center;
    }

    .cunnect-logo {
      display: inline-flex;
      align-items: baseline;
      font-family: "Poppins", system-ui, sans-serif;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -3px;
      line-height: 1;
    }

    .logo-cu {
      color: #ff1022;
      text-shadow: 0 0 20px rgba(255, 16, 34, .45),
                   0 0 60px rgba(255, 16, 34, .18);
    }

    .logo-nnect {
      color: #fff;
      text-shadow: 0 2px 10px rgba(255, 255, 255, .16);
    }

    .logo-tagline {
      display: block;
      margin: 10px 0 8px;
      color: #d4c7a3;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .vendor-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid rgba(241, 11, 29, .45);
      border-radius: 99px;
      color: #ff9ca5;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .7px;
    }

    .vendor-chip::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      content: "";
      box-shadow: 0 0 9px var(--red);
    }

    .login-message {
      margin: 0 0 17px;
      padding: 10px 11px;
      border: 1px solid rgba(241, 11, 29, .5);
      border-radius: 9px;
      background: rgba(241, 11, 29, .1);
      color: #ffabb2;
      font-size: 12px;
      line-height: 1.4;
    }

    h1 {
      margin: 0 0 7px;
      font-size: 23px;
      letter-spacing: -.5px;
    }

    .intro {
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    label {
      display: block;
      margin: 0 0 7px;
      color: #c3c3c3;
      font-size: 11.5px;
      font-weight: 700;
    }

    .field {
      width: 100%;
      height: 46px;
      margin: 0 0 16px;
      padding: 0 13px;
      border: 1px solid #363636;
      border-radius: 10px;
      outline: 0;
      background: #0c0c0c;
      color: #fff;
      font: inherit;
      font-size: 13px;
    }

    .field:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(241, 11, 29, .11);
    }

    .field::placeholder { color: #686868; }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: -2px 0 23px;
      color: var(--muted);
      font-size: 11.5px;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: var(--muted);
      font-weight: 500;
    }

    input[type="checkbox"] { accent-color: var(--red); }

    .options a {
      color: #ff7f89;
      text-decoration: none;
      white-space: nowrap;
    }

    .login-btn {
      width: 100%;
      height: 47px;
      border: 0;
      border-radius: 12px;
      background: var(--red);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(241, 11, 29, .22);
    }

    .login-btn:hover { background: #d90819; }

    .help {
      margin: 21px 0 0;
      color: #8f8f8f;
      text-align: center;
      font-size: 11.5px;
    }

    .help a {
      color: #efefef;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 420px) {
      .page-center { padding: 14px; }
      .login-card { padding: 29px 20px 22px; }
    }
  </style>
</head>
<body>
  <!-- Put your MP4 video in: food/static/images/vendor_login_bg.mp4 -->
  <video class="background-video" autoplay muted loop playsinline>
    <source src="{% static 'images/CU.mp4' %}" type="video/mp4">
  </video>
  <div class="video-overlay"></div>

  <div class="page-center">
    <main class="login-card">
      <div class="login-logo-wrap">
        <div class="cunnect-logo">
          <span class="logo-cu">CU</span><span class="logo-nnect">nnect</span>
        </div>
        <span class="logo-tagline"></span>
        <span class="vendor-chip">PARTNER PORTAL</span>
      </div>

      

      {% if messages %}
        {% for message in messages %}
          <div class="login-message">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}

        <label for="phone">Vendor Mobile Number</label>
        <input
          class="field"
          id="phone"
          name="phone"
          type="tel"
          inputmode="numeric"
          placeholder="Enter mobile number"
          required
        >

        <label for="password">Password</label>
        <input
          class="field"
          id="password"
          name="password"
          type="password"
          placeholder="Enter your password"
          required
        >

        <div class="options">
          <label><input type="checkbox" name="remember"> Keep me signed in</label>
          <a href="#">Forgot password?</a>
        </div>

        <button class="login-btn" type="submit">Login to Dashboard</button>
      </form>

      <p class="help">Need a vendor account? <a href="#">Contact CUnnect support</a></p>
    </main>
  </div>
</body>
</html>
