<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Login · CUnnect</title>
  <style>
    :root { --red:#f10b1d; --muted:#9e9e9e; --line:#2b2b2b; }
    * { box-sizing:border-box; } html,body { min-height:100%; margin:0; }
    body { display:grid; place-items:center; padding:20px; background:radial-gradient(circle at 85% 7%,rgba(241,11,29,.17),transparent 30%),#050505; color:#f7f7f7; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    .card { width:min(100%,390px); padding:34px 25px 25px; border:1px solid var(--line); border-radius:22px; background:rgba(18,18,18,.96); box-shadow:0 18px 55px rgba(0,0,0,.55); }
    .brand { margin-bottom:33px; text-align:center; font-size:30px; font-weight:850; letter-spacing:-1.7px; } .brand strong { color:var(--red); }
    .tag { display:inline-flex; gap:6px; align-items:center; margin-top:7px; padding:5px 10px; border:1px solid rgba(241,11,29,.45); border-radius:99px; color:#ff9ca5; font-size:10px; font-weight:800; letter-spacing:.7px; } .tag::before { width:6px; height:6px; border-radius:50%; background:var(--red); content:""; box-shadow:0 0 9px var(--red); }
    h1 { margin:0 0 7px; font-size:23px; } .intro { margin:0 0 24px; color:var(--muted); font-size:13px; line-height:1.45; }
    .message { margin:0 0 17px; padding:10px 12px; border:1px solid rgba(241,11,29,.55); border-radius:9px; background:rgba(241,11,29,.12); color:#ffabb2; font-size:12px; line-height:1.4; }
    label { display:block; margin:0 0 7px; color:#c3c3c3; font-size:11.5px; font-weight:700; } .field { width:100%; height:46px; margin:0 0 16px; padding:0 13px; border:1px solid #363636; border-radius:10px; outline:0; background:#0c0c0c; color:#fff; font:inherit; font-size:13px; } .field:focus { border-color:var(--red); box-shadow:0 0 0 3px rgba(241,11,29,.11); }
    .login-btn { width:100%; height:47px; border:0; border-radius:12px; background:var(--red); box-shadow:0 8px 18px rgba(241,11,29,.22); color:#fff; cursor:pointer; font:inherit; font-size:14px; font-weight:800; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><strong>CU</strong>nnect<br><span class="tag">DELIVERY PARTNER</span></div>
    <h1>Delivery Login</h1><p class="intro">Sign in to collect ready orders and verify delivery OTPs.</p>
    {% if messages %}{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post">{% csrf_token %}
      <label for="phone">Delivery Mobile Number</label><input class="field" id="phone" name="phone" type="tel" inputmode="numeric" placeholder="Enter mobile number" required>
      <label for="password">Password</label><input class="field" id="password" name="password" type="password" placeholder="Enter your password" required>
      <button class="login-btn" type="submit">Login to Delivery Dashboard</button>
    </form>
  </main>
</body>
</html>
